server {
    listen 80;
    server_name kugni.com www.kugni.com;
    return 301 https://www.kugni.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.kugni.com;
    ssl_certificate /etc/letsencrypt/live/www.kugni.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kugni.com/privkey.pem;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
