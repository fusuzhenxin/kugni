name: kugni
x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://kugni:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kugni
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
  BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-admin@kugni.com}
  BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
  SITE_URL: https://www.kugni.com
  BROWSER_ORIGIN: https://www.kugni.com
  WEB_INTERNAL_URL: http://web:3000
  COOKIE_SECURE: 'true'
  ALLOW_PRIVATE_TARGETS: 'false'
  STORAGE_DIR: /srv/storage
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-true}
  TRANSLATION_PROXY_URL: ${TRANSLATION_PROXY_URL:-}
  STATION_SOURCE_PROXY_URL: ${STATION_SOURCE_PROXY_URL:-}
  STATION_SOURCE_DNS_URL: ${STATION_SOURCE_DNS_URL:-}
  GEOIP_DATABASE: ${GEOIP_DATABASE:-}
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: kugni
      POSTGRES_DB: kugni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kugni -d kugni']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
    command: [sh, -c, 'alembic upgrade head && python -m app.seed']
    volumes: [uploads:/srv/storage]
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [uploads:/srv/storage]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: https://www.kugni.com
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
    depends_on:
      api: {condition: service_healthy}
    ports: ['127.0.0.1:3001:3000']
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: *api-env
    command: [python, -m, app.worker]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    volumes: [uploads:/srv/storage]
    restart: unless-stopped
volumes:
  postgres-data:
  uploads:
